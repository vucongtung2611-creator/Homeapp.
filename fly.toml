# Fly.io: `fly launch --copy-config --no-deploy`, then
# `fly volumes create homeapp_data --size 1` and `fly deploy`.
# Set PUBLIC_URL to the app's https URL (fly launch prints it).
app = "homeapp-light"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[[mounts]]
  source = "homeapp_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Chat streams need the machine to stay up; SQLite needs exactly one machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpus = 1
