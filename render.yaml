# Render Blueprint: New → Blueprint → pick this repo.
# A persistent disk needs the Starter plan; on the free plan data is wiped on every deploy/restart.
services:
  - type: web
    name: homeapp-light
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/me
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: PUBLIC_URL
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
